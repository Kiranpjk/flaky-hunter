name: flaky-hunter
description: Find flaky tests by comparing JUnit XML reports from several CI runs.
inputs:
  reports:
    description: Path(s) to JUnit XML files or directories (space separated)
    required: true
  commit-regex:
    description: Regex with one group that extracts the commit SHA from report file names
    required: false
    default: ""
  max-flaky:
    description: Fail the step if more tests than this are flaky
    required: false
    default: ""
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v7
      with:
        python-version: "3.12"
    - shell: bash
      run: pip install --quiet "${{ github.action_path }}"
    - shell: bash
      env:
        REPORTS: ${{ inputs.reports }}
        COMMIT_REGEX: ${{ inputs.commit-regex }}
        MAX_FLAKY: ${{ inputs.max-flaky }}
      run: |
        args=()
        [ -n "$COMMIT_REGEX" ] && args+=(--commit-regex "$COMMIT_REGEX")
        [ -n "$MAX_FLAKY" ] && args+=(--max-flaky "$MAX_FLAKY")
        # shellcheck disable=SC2086
        flaky-hunter $REPORTS "${args[@]}"
